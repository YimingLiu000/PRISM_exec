# PRISM 运行环境
# 说明：
# 1. 这个环境只负责安装软件和 R 包，不包含大型数据库与参考索引。
# 2. Kraken2 / BLAST / STAR / Minimap2 所需数据库仍需单独准备。
# 3. PRISM 仓库额外要求下载 genbank/ 目录并放到 ${PROJECT_ROOT}/00script/repo 下。
# 4. 这里保留 bioconda 的 `kraken2=2.17.1` 作为基础依赖。
# 5. 如果你需要 GitHub PR #1015 的下载修复版，请在创建环境后执行：
#    `bash ${PROJECT_ROOT}/00script/07_patch_installs/install_kraken2_pr1015.sh`
# 6. 该安装脚本会从源码编译并把修复版放到当前 conda 环境中，使 `k2/kraken2/kraken2-build`
#    优先指向修复版。

name: prism
channels:
  - bioconda
  - conda-forge
dependencies:
  # 基础运行环境
  - python=3.11
  - bash
  - coreutils
  - gawk
  - git
  - grep
  - make
  - perl=5.32.1
  - sed
  - sshpass
  - pigz=2.8
  - unzip

  # R 与 R 包
  - r-base=4.3.3
  - r-optparse=1.7.5
  # - bioconductor-shortread=1.60.0 # 若网络不佳先注释掉
  - r-tidyverse=2.0.0
  - r-furrr=0.3.1
  - r-data.table=1.17.8
  - r-vegan=2.7_1
  - r-xgboost=1.7.6

  # PRISM 依赖的外部生信工具
  - kraken2=2.17.1
  - minimap2=2.30
  - star=2.7.11b
  - blast=2.17.0
  - seqkit=2.13.0
  - ncbi-datasets-cli
